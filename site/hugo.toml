baseURL = "https://modernworkweekly.com"
languageCode = "en-us"
title = "Modern Work Weekly"

[params]
  author = "Ryan Arbuckle"
  description = "Weekly Microsoft 365 and Modern Work change digest for engineers, architects, and admins."
  subtitle = "by Ryan Arbuckle"
  github = "https://github.com/TwitchSTL/modern-work-weekly"
  linkedin = "https://www.linkedin.com/in/ryanarbuckle/"
  keywords = ["Microsoft 365", "Intune", "Entra", "Defender", "Modern Work", "IT Admin"]
  # Privacy-respecting analytics (GoatCounter, cookie-free) — see baseof.html
  # for the two ways to fill this in (hosted site code, or self-hosted
  # https:// count endpoint). Unset = no analytics script loads at all.
  # goatcounter = "modernworkweekly"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    style = "github"
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[params.rss]
  enabled = true

[menu]
  [[menu.main]]
    name = "Exec Guide"
    url = "/exec/"
    weight = 1
  [[menu.main]]
    name = "Key Dates"
    url = "/deadlines/"
    weight = 2
  [[menu.main]]
    name = "Universe"
    url = "/universe/"
    weight = 3
  [[menu.main]]
    name = "What Is Modern Work?"
    url = "/what-is-modern-work/"
    weight = 4
